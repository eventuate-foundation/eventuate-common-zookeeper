version: 2.1
orbs:
  build-and-test:
    jobs:
      build-and-test:
        parameters:
          script:
            description: the script to execute
            type: string
          resource_class:
            description: the resource class
            type: string
            default: 'medium'
          skip_multi_arch_env_vars:
            description: if set don't set multi-arch env vars
            type: string
            default: ''
        machine:
          image: ubuntu-2404:2024.11.1
        resource_class: <<parameters.resource_class>>
        working_directory: ~/eventuate-common-zookeeper
        steps:
          - checkout
          - restore_cache:
              keys:
                - eventuate-common-zookeeper-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
                - eventuate-common-zookeeper-
          - run:
              command: |
                ./gradlew testClasses
          - save_cache:
              paths:
                - ~/.gradle
              key: eventuate-common-zookeeper-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          - run:
              command: |
                if [ -z "<<parameters.skip_multi_arch_env_vars>>" ] ; then
                  . set-multi-arch-image-env-vars.sh
                fi
                <<parameters.script>>
          - run:
              name: Save test results
              command: ./.circleci/save-containers-and-tests.sh
              when: always
          - store_test_results:
              path: ~/junit
          - store_artifacts:
              path: ~/junit
          - store_artifacts:
              path: ~/container-logs
  native-image:
    jobs:
      build:
        parameters:
          script:
            description: the script to execute
            type: string
          resource_class:
            description: the resource class, which determines the platform
            type: string
        machine:
          image: ubuntu-2404:2024.11.1
        resource_class: <<parameters.resource_class>>
        working_directory: ~/eventuate-common-zookeeper
        steps:
          - checkout
          - run:
              name: docker build
              command: |
                . set-multi-arch-image-env-vars.sh
                echo ${DOCKER_PASSWORD?} | docker login -u ${DOCKER_USER_ID?} --password-stdin
                <<parameters.script>>
      merge:
        parameters:
          script:
            description: the script to execute
            type: string
        docker:
          - image: cimg/base:stable
        working_directory: ~/eventuate-common-zookeeper
        steps:
          - checkout
          - setup_remote_docker
          - run:
              name: docker buildx imagetools create
              command: |
                . set-multi-arch-image-env-vars.sh
                echo ${DOCKER_PASSWORD?} | docker login -u ${DOCKER_USER_ID?} --password-stdin
                <<parameters.script>>
workflows:
  version: 2.1
  build-test-and-deploy:
    jobs:
      - native-image/build:
          name: build-native-image-zookeeper-intel
          script: ./build-docker-image-native.sh $ZOOKEEPER_MULTI_ARCH_IMAGE zookeeper/Dockerfile zookeeper
          resource_class: medium
          context:
            - publish
      - native-image/build:
          name: build-native-image-zookeeper-arm
          script: ./build-docker-image-native.sh $ZOOKEEPER_MULTI_ARCH_IMAGE zookeeper/Dockerfile zookeeper
          resource_class: arm.medium
          context:
            - publish
      - native-image/merge:
          name: build-multi-arch-image-zookeeper
          script: ./merge-docker-image-multi-arch.sh $ZOOKEEPER_MULTI_ARCH_IMAGE
          context:
            - publish
          requires:
            - build-native-image-zookeeper-intel
            - build-native-image-zookeeper-arm
      - build-and-test/build-and-test:
          name: test-zookeeper-multi-arch-intel
          script: ./build-and-test-all.sh
          requires:
            - build-multi-arch-image-zookeeper
      - build-and-test/build-and-test:
          name: test-zookeeper-multi-arch-arm
          script: ./build-and-test-all.sh
          resource_class: arm.medium
          requires:
            - build-multi-arch-image-zookeeper
      - build-and-test/build-and-test:
          name: deploy-artifacts
          context:
            - publish
          requires:
            - test-zookeeper-multi-arch-intel
            - test-zookeeper-multi-arch-arm
          script: ./deploy-artifacts.sh
      - build-and-test/build-and-test:
          name: deploy-multi-arch
          context:
            - publish
          requires:
            - test-zookeeper-multi-arch-intel
            - test-zookeeper-multi-arch-arm
          script: ./deploy-multi-arch.sh
